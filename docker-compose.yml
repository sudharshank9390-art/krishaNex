services:
  postgres:
    image: postgres:16-alpine
    container_name: krishnex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: krishnex
      POSTGRES_USER: krishnex
      POSTGRES_PASSWORD: krishnex_local_only
    ports:
      - "5432:5432"
    volumes:
      - krishnex_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krishnex -d krishnex"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  krishnex_postgres_data: